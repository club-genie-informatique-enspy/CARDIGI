services:
  - type: web
    name: cardigi-backend
    plan: free
    env: docker
    # Dockerfile handles build and start commands
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: DEBUG
        value: false
      - key: API_VERSION
        value: v1
      - key: API_PREFIX
        value: /api/v1
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRATION_HOURS
        value: 24
      - key: ADMIN_CREATION_SECRET
        sync: false
      - key: EXTERNAL_API_URL
        value: http://localhost:8080/api
      - key: EXTERNAL_API_KEY
        value: local-mode-no-external-api
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: '["https://cardigi-orcin.vercel.app", "http://localhost:3000"]'

