services:
  - type: web
    name: cardigi-backend
    plan: free
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: DEBUG
        value: false
      - key: API_VERSION
        value: v1
      - key: API_PREFIX
        value: /api/v1
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRATION_HOURS
        value: 24
      - key: ADMIN_CREATION_SECRET
        sync: false
      - key: EXTERNAL_API_URL
        value: http://localhost:8080/api
      - key: EXTERNAL_API_KEY
        value: local-mode-no-external-api
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: ALLOWED_ORIGINS
        value: '["https://cardigi-orcin.vercel.app", "http://localhost:3000"]'

